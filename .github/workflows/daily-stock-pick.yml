name: Daily AI Stock Pick

on:
  schedule:
    # Beijing Mon-Fri 07:15 (= UTC Sun-Thu 23:15). Keep the schedule in UTC
    # for compatibility with repositories where timezone-aware schedules are
    # not yet enabled. Scheduled earlier so GitHub queue delays still land
    # before the A-share open; pre-market analysis uses the prior session.
    - cron: "15 23 * * 0-4"
  workflow_dispatch:

jobs:
  stock-pick:
    concurrency:
      group: daily-stock-pick
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --omit=dev
      - name: Validate strategy logic
        run: npm test
      - name: Analyze and email recommendations
        run: node server.mjs
        env:
          RUN_ONCE: "true"
          TZ: Asia/Shanghai
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          SHIZIXI_API_KEY: ${{ secrets.SHIZIXI_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          MARKET_HOLIDAYS: ${{ vars.MARKET_HOLIDAYS }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

